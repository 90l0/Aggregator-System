name: Deploy to Cloudflare

on:
  push:
    branches:
      - master
      - production
  pull_request:
    branches:
      - master

jobs:
  deploy-workers:
    name: Deploy Workers (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run type-check

      - name: Check deployment secrets
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SECRET_KEY" || { echo "::error::Missing Actions secret SECRET_KEY"; exit 1; }

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          npx wrangler deploy --config wrangler.worker.toml
          printf '%s' "$SECRET_KEY" | npx wrangler secret put SECRET_KEY --config wrangler.worker.toml --name aims-aggregator

  deploy-pages:
    name: Deploy Pages (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: https://aims-aggregator.aims-aggregator.workers.dev

      - name: Check Pages output and deployment secrets
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          for file in index.html robots.txt sitemap.xml; do
            test -s "frontend/build/$file" || { echo "::error::Missing frontend/build/$file"; exit 1; }
          done
          grep -RqF 'https://aims-aggregator.aims-aggregator.workers.dev' frontend/build/static/js || {
            echo "::error::Frontend bundle is missing the production Worker API URL"
            exit 1
          }

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy frontend/build --project-name=aims-aggregator

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-workers, deploy-pages]
    if: always() && github.event_name == 'push'
    steps:
      - name: Deployment Summary
        env:
          WORKER_RESULT: ${{ needs.deploy-workers.result }}
          PAGES_RESULT: ${{ needs.deploy-pages.result }}
        run: |
          echo "Deployment results:"
          echo "Workers: $WORKER_RESULT"
          echo "Pages: $PAGES_RESULT"
          echo "Backend: https://aims-aggregator.aims-aggregator.workers.dev"
          echo "Frontend: https://aims-aggregator.pages.dev"
      - name: Mark failed deployments
        if: needs.deploy-workers.result != 'success' || needs.deploy-pages.result != 'success'
        run: |
          echo "::error::One or more Cloudflare deployments failed."
          exit 1
