name: Deploy to Cloudflare

on:
  push:
    branches:
      - master
      - production
  pull_request:
    branches:
      - master

jobs:
  deploy-workers:
    name: Deploy Workers (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run type-check

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          npx wrangler deploy --config wrangler.worker.toml
          printf '%s' "$SECRET_KEY" | npx wrangler secret put SECRET_KEY --config wrangler.worker.toml --name aims-aggregator

  deploy-pages:
    name: Deploy Pages (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy frontend/build --project-name=aims-aggregator

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-workers, deploy-pages]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo "Backend: https://aims-aggregator.aims-aggregator.workers.dev"
          echo "Frontend: https://aims-aggregator.pages.dev"
