name = "aims-aggregator"
account_id = "757aeca7c03d238cf5897c0deb39b9cd"
workers_dev = true

main = "src/index.ts"
compatibility_date = "2024-01-15"

# Database binding for D1 (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "aims-db"
database_id = "feaedfb7-52ed-463d-996a-3c9466bcc7ac"

# KV namespace for caching and sessions
[[kv_namespaces]]
binding = "CACHE"
id = "b1482d1ae6e94efb8417eb8838ddb769"
preview_id = "4761902200564fa895e6ce2517345364"

# Environment variables for production
[env.production]
name = "aims-aggregator-prod"
vars = { ENVIRONMENT = "production", SECRET_KEY = "417b7ac5d1a138e27e1810b52378cece994d0e8efa3a97f805087d3f5d0d4349", API_BASE_URL = "https://aims-aggregator.aims-aggregator.workers.dev" }

[env.staging]
name = "aims-aggregator-staging"
vars = { ENVIRONMENT = "staging" }

# Development environment
[env.development]
name = "aims-aggregator-dev"
vars = { ENVIRONMENT = "development" }

# Triggers and scheduled tasks
[triggers]
crons = ["0 */6 * * *"]

# Service bindings for connecting to other workers if needed
# [[services]]
# binding = "AUTH_SERVICE"
# service = "auth-worker"
